[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-brokers-platform"
version = "0.3.0"
description = "QuantStrategyLab platform layer for Interactive Brokers."
requires-python = ">=3.11"
dependencies = [
    "flask",
    "gunicorn",
    "pandas",
    "numpy",
    "requests",
    "pytz",
    "pandas-market-calendars",
    "ib-insync",
    "google-auth",
    "google-cloud-compute",
    "google-cloud-secret-manager",
    "google-cloud-storage",
    "yfinance",
    "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@0507eedd44b8590ef232008a2b6d1469fec0b910",
    "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@64574bdd0e213c6938c5144773d7e827ddef4ef2",
    "hk-equity-strategies @ git+https://github.com/QuantStrategyLab/HkEquityStrategies.git@7e9abf9b0f92647f04b4978ff0771b3bd4f75ae3",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "*/external/*"]

[tool.coverage.report]
show_missing = true

[tool.setuptools]
py-modules = [
  "decision_mapper",
  "main",
  "runtime_config_support",
  "runtime_execution_policy",
  "runtime_logging",
  "strategy_loader",
  "strategy_registry",
  "strategy_runtime",
]

[tool.setuptools.packages.find]
include = [
  "application*",
  "entrypoints*",
  "notifications*",
  "scripts*",
  "strategy*",
]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@0507eedd44b8590ef232008a2b6d1469fec0b910",
]
