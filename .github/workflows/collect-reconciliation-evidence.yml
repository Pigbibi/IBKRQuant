name: Collect IBKR Reconciliation Evidence

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Frozen live target to read; this workflow has no order path."
        required: true
        default: all
        type: choice
        options:
          - all
          - soxl_soxx_trend_income
          - tqqq_growth_income
          - global_etf_rotation
          - russell_top50_leader_rotation

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: interactivebrokersquant
  GCP_REGION: us-central1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ibkr-platform-deploy@interactivebrokersquant.iam.gserviceaccount.com
  GCP_SCHEDULER_SERVICE_ACCOUNT: ibkr-platform-scheduler@interactivebrokersquant.iam.gserviceaccount.com

concurrency:
  group: ibkr-reconciliation-evidence-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  collect:
    name: Read ${{ matrix.profile }} baseline evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: soxl_soxx_trend_income
            service: interactive-brokers-quant-live-u15998061-service
          - profile: tqqq_growth_income
            service: interactive-brokers-quant-live-u16608560-service
          - profile: global_etf_rotation
            service: interactive-brokers-quant-live-u18308207-service
          - profile: russell_top50_leader_rotation
            service: interactive-brokers-quant-live-u18336562-service
    steps:
      - name: Select requested target
        id: selection
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_TARGET" = "all" ] || [ "$REQUESTED_TARGET" = "$PROFILE" ]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: ${{ steps.selection.outputs.selected == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ steps.selection.outputs.selected == 'true' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve Cloud Run audience
        id: audience
        if: ${{ steps.selection.outputs.selected == 'true' }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$service_url"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"

      - name: Schedule one-shot internal reconciliation request
        id: scheduler
        if: ${{ steps.selection.outputs.selected == 'true' }}
        env:
          PROFILE: ${{ matrix.profile }}
          SERVICE_URL: ${{ steps.audience.outputs.service_url }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_URL"
          job_name="ibkr-reconcile-${PROFILE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          case "$PROFILE" in
            soxl_soxx_trend_income) delay_minutes=3 ;;
            tqqq_growth_income) delay_minutes=5 ;;
            global_etf_rotation) delay_minutes=7 ;;
            russell_top50_leader_rotation) delay_minutes=9 ;;
            *)
              echo "Unsupported reconciliation profile: $PROFILE" >&2
              exit 1
              ;;
          esac
          schedule="$(date -u -d "+${delay_minutes} minutes" '+%M %H %d %m *')"
          if gcloud scheduler jobs describe "$job_name" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" >/dev/null 2>&1; then
            echo "Refusing to replace an existing reconciliation job: $job_name" >&2
            exit 1
          fi
          gcloud scheduler jobs create http "$job_name" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --schedule "$schedule" \
            --time-zone 'Etc/UTC' \
            --uri "${SERVICE_URL}/reconcile" \
            --http-method POST \
            --oidc-service-account-email "$GCP_SCHEDULER_SERVICE_ACCOUNT" \
            --oidc-token-audience "$SERVICE_URL" \
            --attempt-deadline '300s' \
            --max-retry-attempts=0 \
            --max-retry-duration=0s \
            --quiet >/dev/null
          {
            echo "job_name=$job_name"
            echo "requested_at=$requested_at"
          } >> "$GITHUB_OUTPUT"

      # This provenance binds the report-serving revision and its image deploy labels only;
      # it does not prove scheduler correlation or that this workflow run created the revision.
      - name: Read private no-order reconciliation candidate
        id: receipt
        if: ${{ steps.selection.outputs.selected == 'true' }}
        env:
          PROFILE: ${{ matrix.profile }}
          SERVICE: ${{ matrix.service }}
          SERVICE_URL: ${{ steps.audience.outputs.service_url }}
          REQUESTED_AT: ${{ steps.scheduler.outputs.requested_at }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_URL"
          test -n "$REQUESTED_AT"
          mkdir -p reports
          log_entry=''
          logging_read_failures=0
          for attempt in $(seq 1 96); do
            logging_output=''
            logging_read_status=0
            logging_output="$(gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE}\" AND timestamp>=\"${REQUESTED_AT}\" AND textPayload:\"execution_report gs://\"" --project "$GCP_PROJECT_ID" --freshness=15m --limit=10 --format=json 2>/dev/null)" || logging_read_status=$?
            if [ "$logging_read_status" -ne 0 ]; then
              logging_read_failures=$((logging_read_failures + 1))
              sleep 5
              continue
            fi
            if ! jq -e . >/dev/null <<< "$logging_output"; then
              echo "reconciliation_log_query_failed class=invalid_logging_json" >&2
              exit 1
            fi
            log_entry="$(jq -c 'first(.[] | select(.textPayload? | startswith("execution_report gs://")) | select(.resource.labels.revision_name? | type == "string" and length > 0)) // empty' <<< "$logging_output")"
            if [ -n "$log_entry" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$log_entry" ]; then
            if [ "$logging_read_failures" -eq 96 ]; then
              echo "reconciliation_log_query_failed class=logging_read_nonzero_exit" >&2
            elif [ "$logging_read_failures" -gt 0 ]; then
              echo "reconciliation_log_query_failed class=mixed_logging_read_failures_no_candidate" >&2
            else
              echo "reconciliation_log_query_timeout class=no_matching_candidate" >&2
            fi
            exit 1
          fi
          report_uri="$(jq -er '.textPayload | capture("^execution_report (?<uri>gs://[^[:space:]]+)$").uri' <<< "$log_entry")"
          serving_revision="$(jq -er '.resource.labels.revision_name | select(type == "string" and length > 0)' <<< "$log_entry")"
          revision_labels="$(gcloud run revisions describe "$serving_revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='json(metadata.labels)')"
          service_revision_commit_sha="$(jq -er '."commit-sha" | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$revision_labels")"
          service_deploy_run_id="$(jq -er '."github-run-id" | select(type == "string" and test("^[0-9]+$"))' <<< "$revision_labels")"
          gcloud storage cat "$report_uri" | jq --arg profile "$PROFILE" '
            .diagnostics.broker_reconciliation as $candidate
            | {
                schema_version: "ibkr_reconciliation_artifact.v1",
                strategy_profile: $profile,
                report_status: .status,
                reconciliation: $candidate,
                errors: [
                  .errors[]? | {
                    stage,
                    error_type,
                    failure_category
                  }
                ]
              }
          ' > "reports/${PROFILE}.json"
          jq -e --arg profile "$PROFILE" '
            .schema_version == "ibkr_reconciliation_artifact.v1"
            and .strategy_profile == $profile
            and .reconciliation.schema_version == "ibkr_reconciliation_candidate.v1"
            and .reconciliation.evidence.platform_id == "ibkr"
            and .reconciliation.evidence.strategy_profile == $profile
            and (.reconciliation.recovery_blockers | type == "array")
          ' "reports/${PROFILE}.json" >/dev/null
          evidence_sha256="$(sha256sum "reports/${PROFILE}.json" | awk '{print $1}')"
          test "${#evidence_sha256}" -eq 64
          {
            echo "evidence_sha256=$evidence_sha256"
            echo "serving_revision=$serving_revision"
            echo "service_revision_commit_sha=$service_revision_commit_sha"
            echo "service_deploy_run_id=$service_deploy_run_id"
          } >> "$GITHUB_OUTPUT"
          jq -r '[.reconciliation.permits_active_lkg, .reconciliation.expected_digests_configured, (.reconciliation.recovery_blockers | length)] | @tsv' \
            "reports/${PROFILE}.json" | awk -F '\t' '{print "candidate_collected permits_active_lkg=" $1 ", expected_digests_configured=" $2 ", blockers=" $3}'

      - name: Delete temporary internal reconciliation job
        if: ${{ always() && steps.selection.outputs.selected == 'true' }}
        env:
          SCHEDULER_JOB: ${{ steps.scheduler.outputs.job_name }}
        run: |
          set -euo pipefail
          if [ -n "$SCHEDULER_JOB" ]; then
            gcloud scheduler jobs delete "$SCHEDULER_JOB" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --quiet
          fi

      - name: Retain redacted candidate
        id: receipt_artifact
        if: ${{ success() && steps.selection.outputs.selected == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ibkr-reconciliation-${{ matrix.profile }}-${{ github.run_id }}
          path: reports/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate reconciliation source record
        if: ${{ success() && steps.selection.outputs.selected == 'true' }}
        env:
          ARTIFACT_ID: ${{ steps.receipt_artifact.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.receipt_artifact.outputs.artifact-digest }}
          EVIDENCE_SHA256: ${{ steps.receipt.outputs.evidence_sha256 }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          PROFILE: ${{ matrix.profile }}
          SERVICE: ${{ matrix.service }}
          SERVICE_REVISION: ${{ steps.receipt.outputs.serving_revision }}
          SERVICE_REVISION_COMMIT_SHA: ${{ steps.receipt.outputs.service_revision_commit_sha }}
          SERVICE_DEPLOY_RUN_ID: ${{ steps.receipt.outputs.service_deploy_run_id }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'QuantStrategyLab/InteractiveBrokersPlatform'
          test "$WORKFLOW_REF" = "${REPOSITORY}/.github/workflows/collect-reconciliation-evidence.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$WORKFLOW_HEAD_SHA"
          test -n "$ARTIFACT_ID"
          test "$ARTIFACT_SHA256" != "$EVIDENCE_SHA256"
          for digest in "$ARTIFACT_SHA256" "$EVIDENCE_SHA256"; do
            test "${#digest}" -eq 64
            case "$digest" in *[!0-9a-f]*) exit 1 ;; esac
          done
          for sha in "$WORKFLOW_HEAD_SHA" "$SERVICE_REVISION_COMMIT_SHA"; do
            test "${#sha}" -eq 40
            case "$sha" in *[!0-9a-f]*) exit 1 ;; esac
          done
          mkdir -p source-records
          source_record="source-records/${PROFILE}.json"
          jq -n \
            --arg schema_version 'ibkr_reconciliation_source_receipt_record.v1' \
            --arg repository "$REPOSITORY" \
            --arg workflow_path '.github/workflows/collect-reconciliation-evidence.yml' \
            --arg workflow_run_id "$WORKFLOW_RUN_ID" \
            --arg workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg workflow_head_sha "$WORKFLOW_HEAD_SHA" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "ibkr-reconciliation-${PROFILE}-${WORKFLOW_RUN_ID}" \
            --arg artifact_sha256 "$ARTIFACT_SHA256" \
            --arg evidence_sha256 "$EVIDENCE_SHA256" \
            --arg service_name "$SERVICE" \
            --arg service_revision "$SERVICE_REVISION" \
            --arg service_revision_commit_sha "$SERVICE_REVISION_COMMIT_SHA" \
            --arg service_deploy_run_id "$SERVICE_DEPLOY_RUN_ID" \
            '{
              schema_version,
              repository,
              workflow_path,
              workflow_run_id,
              workflow_run_attempt,
              workflow_head_sha,
              artifact_id,
              artifact_name,
              artifact_sha256,
              evidence_sha256,
              service_name,
              service_revision,
              service_revision_commit_sha,
              service_deploy_run_id
            }' > "$source_record"
          jq -e '
            (keys | sort) == [
              "artifact_id",
              "artifact_name",
              "artifact_sha256",
              "evidence_sha256",
              "repository",
              "schema_version",
              "service_deploy_run_id",
              "service_name",
              "service_revision",
              "service_revision_commit_sha",
              "workflow_head_sha",
              "workflow_path",
              "workflow_run_attempt",
              "workflow_run_id"
            ]
            and all(.[]; type == "string" and length > 0)
          ' "$source_record" >/dev/null

      - name: Upload reconciliation source record
        id: source_record_artifact
        if: ${{ success() && steps.selection.outputs.selected == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ibkr-reconciliation-source-record-${{ matrix.profile }}-${{ github.run_id }}
          path: source-records/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30
